name: sadat_delivery_merged
description: "Sadat Delivery - Unified app for Captain, Vendor, and User"
publish_to: "none"
version: 1.0.9+32
environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  photo_view: ^0.15.0
  fl_chart: ^0.66.2
  loading_animation_widget: ^1.2.1

  # State management - both Riverpod (captain) and Provider (vendor/user)
  flutter_riverpod: ^2.6.1
  provider: ^6.1.1

  # HTTP and API
  http: ^1.1.2
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Location and permissions
  geolocator: ^13.0.1
  location: ^6.0.2
  permission_handler: ^12.0.1

  # Image and media
  image_picker: ^1.0.7
  image: ^4.1.7

  # Audio
  audioplayers: ^6.1.0
  record: ^6.0.0
  # Splash intro video for the user app (assets/intro.mp4)
  video_player: ^2.9.2

  # File handling
  path_provider: ^2.1.2
  path: ^1.8.3

  # AWS S3 / Wasabi
  minio: ^3.5.8

  # Firebase (messaging for push notifications, Firestore for app-config
  # docs like base_url/force-update — NOT used for chat storage anymore,
  # that moved to Postgres via the backend REST API + Socket.io)
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  cloud_firestore: ^5.6.6
  flutter_local_notifications: ^19.4.1

  uuid: ^4.5.1

  # Navigation
  go_router: ^15.1.2

  # Maps
  google_maps_flutter: ^2.6.1
  url_launcher: ^6.3.0

  # JWT and auth
  jwt_decode: ^0.3.1

  # Internationalization
  flutter_localizations:
    sdk: flutter
  # Deliberately not pinned to an exact version: flutter_localizations pins
  # intl exactly, and that pin differs between Flutter SDK versions (3.44
  # wants 0.20.2, newer stables want 0.20.3+). An exact pin here therefore
  # breaks CI whenever its `flutter: stable` is ahead of the local SDK. Any
  # 0.20.x satisfies both.
  intl: ^0.20.0

  # JSON serialization
  json_annotation: ^4.8.1

  # Timezone
  timezone: ^0.10.1

  # Form validation
  form_field_validator: ^1.1.0

  # Package info
  package_info_plus: ^8.1.2

  # Launcher icons
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.7.1

# dependency_overrides removed - record v6.x resolves platform packages properly

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/shared/logo.jpeg"

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Root-level file: the folder entries below only cover their own
    # directories, so intro.mp4 has to be listed explicitly.
    - assets/intro.mp4
    - assets/shared/
    - assets/captain/
    - assets/vendor/images/
    - assets/user/images/
    - assets/user/images/categories/
    - assets/user/
