workflows:
  ios-release-build:
    name: iOS Release Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: |
          # This project uses CocoaPods only (no Package.swift, no
          # XCRemoteSwiftPackageReference). Flutter's experimental SPM
          # integration mis-parses Runner.xcscheme and aborts the build, so
          # turn it off before any `flutter build` runs.
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Flutter config-only (generates xcconfig & plugin files, skips pod install)
        script: |
          # Drop any stale build/ dir: a previous simulator-configured build
          # leaves Release-iphonesimulator artifacts that make the device build
          # resolve against the simulator SDK.
          rm -rf build ios/.symlinks ios/Flutter/ephemeral
          # No `|| true` here: if config generation fails the xcconfigs are left
          # half-written and the real error only surfaces much later.
          flutter build ios --config-only --release --no-codesign

      - name: Clean and reinstall pods
        script: |
          set -e
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          # `xcodebuild -list` reports the Runner scheme even when the pod
          # sandbox is absent or half-written, so it cannot be trusted as a
          # gate. Assert the generated files exist here instead: this is the
          # true origin of "Supported platforms ... is empty" /
          # "Scheme Runner is not currently configured for the build action",
          # which otherwise only surfaces at the first -showBuildSettings.
          test -f Pods/Pods.xcodeproj/project.pbxproj \
            || { echo ">>> FAIL: pod install produced no Pods.xcodeproj"; exit 1; }
          test -f "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig" \
            || { echo ">>> FAIL: Pods-Runner release xcconfig missing"; exit 1; }
          # The committed workspace referenced only Runner.xcodeproj. Without a
          # Pods.xcodeproj FileRef the Runner target resolves no platform and
          # xcodebuild reports "Supported platforms ... is empty" /
          # "Scheme Runner is not currently configured for the build action".
          WS=Runner.xcworkspace/contents.xcworkspacedata
          echo "=== workspace after pod install ==="
          cat "$WS"
          if ! grep -q "Pods.xcodeproj" "$WS"; then
            echo ">>> Pods.xcodeproj FileRef missing - restoring it"
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<Workspace' \
              '   version = "1.0">' \
              '   <FileRef' \
              '      location = "group:Runner.xcodeproj">' \
              '   </FileRef>' \
              '   <FileRef' \
              '      location = "group:Pods/Pods.xcodeproj">' \
              '   </FileRef>' \
              '</Workspace>' > "$WS"
            cat "$WS"
          fi

      - name: Verify -GCC_WARN_INHIBIT_ALL_WARNINGS was removed by Podfile hook
        script: |
          TARGET_DIR="ios/Pods/Target Support Files/BoringSSL-GRPC"
          echo "=== BoringSSL-GRPC xcconfig files ==="
          ls "$TARGET_DIR" 2>/dev/null || echo "Directory not found: $TARGET_DIR"
          echo "=== Checking for -GCC_WARN_INHIBIT_ALL_WARNINGS ==="
          for f in "$TARGET_DIR"/*.xcconfig; do
            [ -f "$f" ] || continue
            if grep -q -- "-GCC_WARN_INHIBIT_ALL_WARNINGS" "$f"; then
              echo "Still present in: $f — patching now"
              sed -i '' 's/-GCC_WARN_INHIBIT_ALL_WARNINGS//g' "$f"
              echo "After patch:"; grep "OTHER_CFLAGS" "$f" || true
            else
              echo "Clean: $f"
            fi
          done
          echo "=== Patching project.pbxproj directly ==="
          if [ -f ios/Pods/Pods.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/-GCC_WARN_INHIBIT_ALL_WARNINGS//g' ios/Pods/Pods.xcodeproj/project.pbxproj
            echo "Patched Pods.xcodeproj"
          fi
          echo "=== Done ==="

      - name: Verify xcconfig includes Pods (diagnoses "scheme not configured")
        script: |
          echo "=== ios/Flutter/Release.xcconfig ==="
          cat ios/Flutter/Release.xcconfig
          if ! grep -q "Pods-Runner.release.xcconfig" ios/Flutter/Release.xcconfig; then
            echo ">>> Pods include MISSING - restoring it"
            printf '#include? "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"\n#include "Generated.xcconfig"\n' > ios/Flutter/Release.xcconfig
            cat ios/Flutter/Release.xcconfig
          fi
          echo "=== schemes xcodebuild can see ==="
          xcodebuild -workspace ios/Runner.xcworkspace -list

      - name: Verify the scheme still points at a real target
        script: |
          # A find/replace once rewrote BlueprintIdentifier/BlueprintName to
          # BlueIdentifier/BlueName in Runner.xcscheme. Xcode ignores unknown
          # attributes silently, so the scheme still *listed* but referenced no
          # target: "Supported platforms ... is empty" / "Scheme Runner is not
          # currently configured for the build action". Catch that here, where
          # the message names the cause, instead of 3 steps later.
          SCHEME=ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          if grep -qE '\bBlueIdentifier\b|\bBlueName\b' "$SCHEME"; then
            echo ">>> FAIL: $SCHEME uses BlueIdentifier/BlueName."
            echo ">>> They must be BlueprintIdentifier/BlueprintName."
            exit 1
          fi
          grep -q "BlueprintIdentifier" "$SCHEME" \
            || { echo ">>> FAIL: no BlueprintIdentifier in $SCHEME"; exit 1; }
          echo "OK: scheme references a target by BlueprintIdentifier"

      - name: Confirm the build resolves the device SDK, not the simulator
        script: |
          # 2>&1, not 2>/dev/null: discarding stderr hides the actual xcodebuild
          # error and leaves only an empty SDK_NAME to explain the failure.
          SDK=$(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
                  -configuration Release -destination 'generic/platform=iOS' \
                  -showBuildSettings 2>&1 | grep -m1 " SDK_NAME" || true)
          echo "resolved:${SDK}"
          # Require a positive iphoneos match: an empty SDK means
          # -showBuildSettings itself failed, which must not pass silently.
          case "$SDK" in
            *iphonesimulator*)
              echo ">>> FAIL: resolving the simulator SDK for a device build"
              exit 1 ;;
            *iphoneos*)
              echo "OK: device SDK" ;;
            *)
              echo ">>> FAIL: could not read SDK_NAME (showBuildSettings failed)"
              xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
                -configuration Release -destination 'generic/platform=iOS' \
                -showBuildSettings 2>&1 | tail -30
              exit 1 ;;
          esac

      - name: Build iOS Release
        script: |
          # No --verbose: it emits ~10k lines of build settings per target and
          # buries the actual diagnostic. The grep below surfaces it instead.
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/xbuild.log
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "=== error lines ==="
            grep -nE "error:|fatal error|ld: |The following build commands failed|Undefined symbol" /tmp/xbuild.log | head -40
            echo ""
            echo "=== real diagnostic via xcodebuild ==="
            xcodebuild \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | grep -E "error:|fatal error|The following build commands failed|Undefined symbol" | head -40
          fi
          exit $STATUS

    artifacts:
      - build/ios/iphoneos/Runner.app
      - /tmp/xbuild.log

  # ---------------------------------------------------------------------------
  ios-release-workflow:
    name: iOS Release Archive
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Add these in Codemagic UI → Environment variables:
      # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
      # APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY

    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Flutter config-only (generates xcconfig & plugin files, skips pod install)
        script: |
          flutter build ios --config-only --no-codesign 2>/dev/null || true

      - name: Clean and reinstall pods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Strip unsupported -G flag from all pod xcconfig files
        script: |
          find ios/Pods -name "*.xcconfig" | while read f; do
            if grep -q -- " -G" "$f" || grep -q -- "^-G" "$f"; then
              echo "Patching: $f"
              sed -i '' 's/ -G / /g; s/ -G$//; s/^-G //' "$f"
            fi
            if grep -q -- "-GCC_WARN_INHIBIT_ALL_WARNINGS" "$f"; then
              sed -i '' 's/-GCC_WARN_INHIBIT_ALL_WARNINGS//g' "$f"
            fi
          done
          if [ -f ios/Pods/Pods.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/-GCC_WARN_INHIBIT_ALL_WARNINGS//g' ios/Pods/Pods.xcodeproj/project.pbxproj
            echo "Patched Pods.xcodeproj"
          fi
          echo "=== Strip complete ==="

      - name: Build iOS Release IPA (xcodebuild direct)
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -archivePath /tmp/Runner.xcarchive \
            archive \
            2>&1 | tee /tmp/xbuild_release.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "=== lines with -G ==="
            grep -n -- "-G" /tmp/xbuild_release.log | head -20
            echo "=== error lines ==="
            grep -n "error:" /tmp/xbuild_release.log | head -20
          fi
          exit $STATUS

    artifacts:
      - /tmp/Runner.xcarchive
      - /tmp/xbuild_release.log
